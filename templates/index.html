<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMap - İş Takip Yazılımı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        header { padding: 20px 10%; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .hero { padding: 80px 10%; text-align: center; }
        h1 { font-size: 48px; color: #0f172a; margin-bottom: 20px; }
        .btn-play { display: inline-block; padding: 12px 30px; background: #004080; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 20px; }
        
        #video-section { margin-top: 50px; display: flex; justify-content: center; }
        video { width: 80%; max-width: 800px; border-radius: 15px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); background: #000; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 24px; font-weight: 700; color: #004080;">TaskMap</div>
    </header>

    <section class="hero">
        <h1>İşlerinizi Kolayca Takip Edin</h1>
        <p>Proje yönetiminizi modernize edin ve verimliliğinizi artırın.</p>
        
        <a href="#video-section" class="btn-play">Tanıtım İzle</a>

        <div id="video-section">
            <video controls>
                <source src="{{ url_for('static', filename='videos/taskmap_tanitim.mp4') }}" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>
    </section>

</body>
</html>
